<!doctype html>
<html lang="ru" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 + user-scalable=no — это НЕ про «запретить пользователю
      увеличивать», а про то, что портал на телефоне работает как приложение,
      а не как страница (решение владельца 10.09.2026). Без них iOS сам
      наезжает на поле ввода при фокусе — в портале десятки полей с размером
      12–14px, и каждый тап по фильтру уводил экран в масштаб 1.3, из которого
      он уже не возвращается: бар разделов уезжает за край, колокол повисает
      посреди экрана. Двойной тап по содержимому тоже больше не приближает —
      за это отвечает touch-action: manipulation в mobile-shell.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!--
      Защита от встроенного переводчика браузера. Он подменяет текстовые узлы
      обёртками <font>, после чего React пытается удалить узел, которого у
      родителя уже нет, и всё приложение падает с ошибкой
      «Failed to execute 'removeChild' on 'Node'» (воспроизведено на React 18.3.1).
      Защищает именно набор translate="no" + class="notranslate" + мета ниже;
      lang="ru" — это отдельно про корректность: интерфейс полностью русский,
      а страница объявляла lang="en", из-за чего браузер вообще предлагал перевод.
      NB: так же ведут себя расширения (Grammarly, «Читать вслух», подсветчики) —
      от них помогает не это, а элементы-обёртки и key у веток в самих компонентах.
    -->
    <meta name="google" content="notranslate" />
    <title>iCORE</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Портал как приложение на телефоне (PWA). Значок на домашнем экране,
      запуск без адресной строки, работа с плохой сетью — см. public/sw.js,
      public/manifest.webmanifest и src/utils/pwa.js.

      Пути даны от корня (/manifest.webmanifest): Vite при сборке подставляет
      в них base, а на GitHub Pages портал живёт не в корне, а в /OTP/.
      Относительный путь здесь написать НЕЛЬЗЯ — документ по внутреннему адресу
      (/OTP/wiki/...) считал бы его от своего каталога, и манифест не нашёлся бы.
      Внутри самого манифеста, наоборот, всё относительное: он один и тот же
      для корня и для подкаталога.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Цвет строки состояния в установленном приложении. Совпадает с фоном
         портала (bg-gray-50) — строка состояния должна продолжать страницу, а
         не отрезать её полосой. Для тёмного режима значение подменяется на
         ходу, см. applyDarkTheme в src/utils/darkTheme.js. -->
    <meta name="theme-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS манифест читает не полностью: полноэкранный запуск с домашнего
         экрана там до сих пор включается этими двумя метками. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="iCORE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DDGZC3W1MZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // send_page_view: false — page_view шлётся вручную из приложения с корректным
      // page_title (см. trackAppViewAnalytics в src/App.jsx). Иначе на загрузке
      // улетал бы лишний page_view со статичным title "iCORE".
      gtag('config', 'G-DDGZC3W1MZ', { send_page_view: false });
    </script>
  </head>
  <body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler (sessionStorage approach).
      // Reads the redirect path stored by 404.html and restores it via
      // history.replaceState before the React app boots.
      (function () {
        try {
          var redirect = sessionStorage.getItem('__spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('__spa_redirect');
            var base = window.location.pathname.replace(/\/$/, '');
            window.history.replaceState(null, '', base + redirect);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
