<!doctype html>
<html lang="ru" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Защита от встроенного переводчика браузера. Он подменяет текстовые узлы
      обёртками <font>, после чего React пытается удалить узел, которого у
      родителя уже нет, и всё приложение падает с ошибкой
      «Failed to execute 'removeChild' on 'Node'» (воспроизведено на React 18.3.1).
      Защищает именно набор translate="no" + class="notranslate" + мета ниже;
      lang="ru" — это отдельно про корректность: интерфейс полностью русский,
      а страница объявляла lang="en", из-за чего браузер вообще предлагал перевод.
      NB: так же ведут себя расширения (Grammarly, «Читать вслух», подсветчики) —
      от них помогает не это, а элементы-обёртки и key у веток в самих компонентах.
    -->
    <meta name="google" content="notranslate" />
    <title>iCORE</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DDGZC3W1MZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // send_page_view: false — page_view шлётся вручную из приложения с корректным
      // page_title (см. trackAppViewAnalytics в src/App.jsx). Иначе на загрузке
      // улетал бы лишний page_view со статичным title "iCORE".
      gtag('config', 'G-DDGZC3W1MZ', { send_page_view: false });
    </script>
  </head>
  <body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect handler (sessionStorage approach).
      // Reads the redirect path stored by 404.html and restores it via
      // history.replaceState before the React app boots.
      (function () {
        try {
          var redirect = sessionStorage.getItem('__spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('__spa_redirect');
            var base = window.location.pathname.replace(/\/$/, '');
            window.history.replaceState(null, '', base + redirect);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
