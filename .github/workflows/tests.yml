name: Тесты

# Репозиторий ведут две машины, обе пушат прямо в main. Без этого прогона сломанный
# main обнаруживается только когда об него спотыкается второй разработчик.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Concurrency сознательно НЕ задан. Каждый коммит в main едет в прод, поэтому
# проверять надо каждый, а не только последний в серии. С группой и
# cancel-in-progress: true первый же прогон был отменён следующим пушем через
# 7 минут (31472622943) — при 15-37 коммитах в день так отменялось бы почти всё.
# Репозиторий публичный: минуты Actions бесплатны, прогоны идут параллельно.

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Системные библиотеки
        # weasyprint — обёртка над pango/cairo: колесо ставится, а импорт без этих
        # библиотек падает. Дешевле поставить их всегда, чем ловить красный прогон.
        #
        # 09.09.2026 три прогона подряд (34383347491, 34384115432, 34386054956) умерли
        # именно здесь, не дойдя до тестов: в образе раннера прописан сторонний
        # репозиторий Google Chrome, и apt-get update вернул по его индексу
        # «Hash Sum mismatch» — Google переопубликовал Release в 17:16 UTC, а
        # Packages.gz на зеркале остался старый. Наш код тут ни при чём, но
        # apt-get update отдаёт код 100, и шаг валит всю задачу.
        #
        # Поэтому: репозиторий Chrome нам не нужен — убираем его перед обновлением,
        # а сбой самого update больше не считаем фатальным. Индексы архива Ubuntu,
        # откуда и ставятся pango с cairo, apt в этот момент уже забрал («old ones
        # used instead»). Гейтом остаётся install: если библиотек правда нет,
        # прогон покраснеет на нём, а не на чужом сломанном зеркале.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libcairo2

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: pytest
        # Тестам, которым нужна боевая база, она нужна только для чтения, и без
        # DATABASE_URL они скипаются сами. Красный прогон = регресс в коде, а не сеть.
        run: python -X utf8 -m pytest tests -q

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: node --test
        # Именно шаблоном в кавычках: `node --test tests/` пытается загрузить
        # каталог как модуль и падает с MODULE_NOT_FOUND.
        run: node --test "tests/*.test.mjs"
