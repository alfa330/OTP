name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Деплой Pages прерывать НЕЛЬЗЯ (иначе гонки и «Deployment failed, try again later»).
  # Как в официальном шаблоне GitHub Pages: очередь без отмены выполняющегося.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Дефолт экшена — 10 минут ожидания, после чего он ОТМЕНЯЕТ свой
          # deployment. 2026-08-06 очередь Pages не разгружалась дольше, и подряд
          # сорвались 4 публикации (сборка при этом успешна каждый раз), а
          # отменённый deployment ещё и блокировал следующие: «Please cancel
          # <sha> first». Полчаса — чтобы затор на стороне GitHub переживался,
          # а не превращался в непубликацию фронтенда.
          timeout: 1800000
