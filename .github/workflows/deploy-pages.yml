name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Деплой Pages прерывать НЕЛЬЗЯ (иначе гонки и «Deployment failed, try again later»).
  # Как в официальном шаблоне GitHub Pages: очередь без отмены выполняющегося.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Именно ci, а не install: install правит package-lock.json на бегу, и при
        # двух машинах лок начинает дрейфовать и конфликтовать на пустом месте.
        # ci ставит строго по локу и падает, если лок разошёлся с package.json.
        run: npm ci

      - name: Build
        # These checks exercise the recovery and retention used by this release.
        # A broken recovery path must not be published while the full test
        # workflow is still running independently.
        run: |
          node --test tests/stale_bundle_recovery.test.mjs tests/service_worker.test.mjs tests/pages_asset_retention.test.mjs
          npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore optional asset download cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/otp-pages-assets
          key: pages-assets-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-assets-v1-${{ github.ref_name }}-

      - name: Preserve recently deployed build assets
        # Open tabs and cached HTML still import old hashed chunks after a
        # deployment. Pages replaces dist atomically, so carry those files in
        # every release for 24 hours after retirement. Failure must stop
        # publication, not remove old assets still inside that window.
        run: node scripts/preserve_pages_assets.mjs dist
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ASSET_CACHE_DIR: ${{ runner.temp }}/otp-pages-assets

      - name: Save optional asset download cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/otp-pages-assets
          key: pages-assets-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Дефолт экшена — 10 минут ожидания, после чего он ОТМЕНЯЕТ свой
          # deployment. 2026-08-06 очередь Pages не разгружалась дольше, и подряд
          # сорвались 4 публикации (сборка при этом успешна каждый раз), а
          # отменённый deployment ещё и блокировал следующие: «Please cancel
          # <sha> first». Полчаса — чтобы затор на стороне GitHub переживался,
          # а не превращался в непубликацию фронтенда.
          timeout: 1800000
