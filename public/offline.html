    <title>iCORE — нет связи</title>
    <!--
      Страница-заглушка для запуска БЕЗ СЕТИ. Её отдаёт сервис-воркер, когда
      документ не удалось взять ни из сети, ни из кэша, — вместо системной
      страницы браузера, которая с домашнего экрана выглядит как «приложение
      сломалось».

      Внутри страницы нет ни одной внешней ссылки: ни шрифта, ни картинки, ни
      стиля. Знак нарисован тем же SVG, что в сайдбаре, прямо в разметке —
      файл, которого нет в кэше, в офлайне не загрузится, и заглушка приехала
      бы без логотипа именно в тот момент, ради которого она написана.
    -->
    <style>

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: #f9fafb;
        color: #0f172a;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { max-width: 320px; text-align: center; }
      .mark {
        width: 84px; height: 84px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 22px;
        background: linear-gradient(150deg, #22409B 0%, #4A3A96 45%, #7B2E92 100%);
        box-shadow: 0 10px 30px rgba(34, 64, 155, 0.28);
      }
      .mark svg { width: 48px; height: 48px; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: #64748b; }
      button {
        appearance: none; border: 0; cursor: pointer;
        padding: 12px 22px; border-radius: 12px;
        background: #1e40af; color: #fff;
        font-size: 15px; font-weight: 600; font-family: inherit;
      }
      button:active { transform: scale(0.98); }
      @media (prefers-color-scheme: dark) {
        body { background: #17191e; color: #e7e9ee; }
        p { color: #9aa2b1; }
      }
    </style>

      <h1>Нет подключения</h1>
      <p>iCORE не может связаться с сервером. Проверьте интернет и повторите попытку.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
    <script>
      /* Сеть вернулась сама (лифт, метро, переключение на Wi-Fi) — перезагружаем
